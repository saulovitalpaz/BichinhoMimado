<!-- Exemplo de estrutura para listagem financeira -->
<section class="financial-module">
  <header class="module-header">
    <h2>Fluxo de Caixa</h2>
    <button class="btn-primary">+ Nova Transação</button>
  </header>

  <table class="custom-table">
    <thead>
      <tr>
        <th>Data</th>
        <th>Pet / Cliente</th>
        <th>Categoria</th>
        <th>Valor</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr class="income">
        <td>25/05/2023</td>
        <td>Bento (João Silva)</td>
        <td>Consulta</td>
        <td class="text-success">R$ 150,00</td>
        <td><span class="badge paid">Pago</span></td>
      </tr>
      <tr class="expense">
        <td>24/05/2023</td>
        <td>Fornecedor Rações</td>
        <td>Estoque</td>
        <td class="text-danger">- R$ 1.200,00</td>
        <td><span class="badge pending">Pendente</span></td>
      </tr>
    </tbody>
  </table>
</section>
